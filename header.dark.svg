<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="xProv25 — Independent Software Developer">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#fb7185"/>
      <animate attributeName="x1" values="-100%;100%;-100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#140710"/>

  <circle cx="120" cy="40" r="90" fill="#f472b6" opacity="0.08">
    <animate attributeName="r" values="70;110;70" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="190" r="120" fill="#fb7185" opacity="0.07">
    <animate attributeName="r" values="100;150;100" dur="12s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="115" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="72" font-weight="800" fill="url(#grad)" filter="url(#glow)">xProv25</text>

  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="24" letter-spacing="6" fill="#c9a8b8">INDEPENDENT SOFTWARE DEVELOPER</text>

  <rect x="500" y="185" width="200" height="6" rx="3" fill="url(#bar)">
    <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>