<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="xProv25 — Independent Software Developer">
  <rect width="1200" height="200" fill="#ffeaf4"/>

  <text x="600" y="112" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="74" font-weight="700" letter-spacing="-2" fill="#b91d63">
    <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/>
    xProv<tspan fill="#ffffff" style="fill:#ffffff">25</tspan>
  </text>

  <text x="600" y="166" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="20" letter-spacing="10" fill="#d06a9d">INDEPENDENT SOFTWARE DEVELOPER</text>

  <rect x="540" y="182" width="120" height="4" rx="2" fill="#ec4899">
    <animate attributeName="width" values="0;120;0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>