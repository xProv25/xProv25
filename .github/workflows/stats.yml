name: Update README stat cards

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&bg_color=ffeaf4&hide_border=true&border_radius=16&title_color=ec4899&icon_color=ec4899&ring_color=ec4899&text_color=4a1d35
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=compact&bg_color=ffeaf4&hide_border=true&border_radius=16&title_color=ec4899&text_color=4a1d35&card_width=340
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stat cards" || echo "No changes to commit"
          git pull --rebase --autostash || true
          git push