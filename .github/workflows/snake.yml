name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (dark)
        uses: Platane/snk@v3
        with:
          github_user_name: xProv25
          outputs: |
            dist/github-snake-dark.svg?color_snake=#ec4899&color_dots=#220d18,#3a122a,#571a3a,#73204b,#b03b74
      - name: Generate snake (light)
        uses: Platane/snk@v3
        with:
          github_user_name: xProv25
          outputs: |
            dist/github-snake-light.svg?color_snake=#be185d&color_dots=#fdf0f6,#fbd7e9,#f7b7d6,#f28cc0,#e75aa5

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/*.svg
          git commit -m "chore: regenerate contribution snake" || echo "No changes to commit"
          git push